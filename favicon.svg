<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="60%" stop-color="#0f2952"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="archGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="archGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="archGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Premium rounded squircle background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.75"/>

  <!-- Concentric Honai Arches scaled & centered -->
  <g transform="translate(14, 15) scale(1.0)" filter="url(#subtleGlow)" fill="none" stroke-linecap="round">
    <!-- Outer Arch -->
    <path d="M50 14 C 30 14 14 30 14 50 L 14 84" stroke="url(#archGrad1)" stroke-width="8.5"/>
    <path d="M86 84 L 86 50 C 86 30 70 14 50 14" stroke="url(#archGrad1)" stroke-width="8.5"/>

    <!-- Middle Arch -->
    <path d="M50 28 C 38 28 28 38 28 50 L 28 84" stroke="url(#archGrad2)" stroke-width="7.5"/>
    <path d="M72 84 L 72 50 C 72 38 62 28 50 28" stroke="url(#archGrad2)" stroke-width="7.5"/>

    <!-- Inner Arch -->
    <path d="M50 42 C 46 42 42 46 42 50 L 42 84" stroke="url(#archGrad3)" stroke-width="6.5"/>
    <path d="M58 84 L 58 50 C 58 46 54 42 50 42" stroke="url(#archGrad3)" stroke-width="6.5"/>
  </g>
</svg>
